version: '3.8'

services:
  # Django Web Application
  web:
    build: .                    # Build from Dockerfile in current directory
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./credit_approval:/app  # Sync local code with container
    ports:
      - "8000:8000"             # Map port 8000 on host to 8000 in container
    depends_on:
      - db                      # Start db first
      - redis                   # Start redis first
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:password@db:5432/credit_db

  # PostgreSQL Database
  db:
    image: postgres:15          # Use official PostgreSQL 13 image
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist database data
    environment:
      - POSTGRES_DB=credit_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

  # Redis (for Celery task queue)
  redis:
    image: redis:alpine         # Lightweight Redis image
    ports:
      - "6379:6379"

  # Celery Worker (for background tasks)
  celery:
    build: .
    command: celery -A credit_approval worker --loglevel=info
    volumes:
      - ./credit_approval:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/credit_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0


# Named volumes for data persistence
volumes:
  postgres_data:
